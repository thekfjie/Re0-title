<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="日文标题自动排版，提供传统算法与语义规划两种方案。"><title>日文标题排版</title><link rel="stylesheet" href="/style.css"><link rel="icon" href="/favicon.svg"></head>
<body>
<header class="header"><a class="brand" href="/">日文标题排版</a><nav><a href="/benchmark/">A / B 对照</a><a href="/research.html">研究记录</a></nav></header>
<main class="workspace">
<aside class="controls"><form id="form">
<div class="mode-switch" role="tablist" aria-label="生成方案"><button type="button" class="active" data-mode="classic" role="tab" aria-selected="true">A · 传统算法</button><button type="button" data-mode="llm" role="tab" aria-selected="false">B · LLM 语义</button></div>
<div id="mode-note" class="notice" hidden></div>
<section class="control-section"><label class="field-label" for="text">标题 <span id="length"></span></label><textarea id="text" rows="3" maxlength="80" spellcheck="false">聖域の終わりと、崩壊の始まり</textarea>
<div class="examples"><button type="button" data-text="待ちかねた再会">待ちかねた再会</button><button type="button" data-text="絶望という病">絶望という病</button><button type="button" data-text="命の価値">命の価値</button></div></section>
<section class="control-section"><div class="field-label">字体 <button type="button" class="text-button" id="upload-toggle" aria-expanded="false">上传字体</button></div>
<label class="select-field" for="kanji-select"><span>汉字</span><select id="kanji-select" aria-label="汉字字体"></select></label>
<label class="select-field" for="kana-select"><span>假名</span><select id="kana-select" aria-label="假名字体"></select></label>
<div id="uploads" class="uploads" hidden><label class="upload" for="kanji"><span>上传主体字体</span><span id="kanji-name">TTF / OTF · 24 MiB</span></label><input id="kanji" type="file" accept=".ttf,.otf" class="file-input"><label class="upload" for="kana"><span>上传假名字体</span><span id="kana-name">TTF / OTF · 24 MiB</span></label><input id="kana" type="file" accept=".ttf,.otf" class="file-input"><p id="privacy-note">上传字体仅限当前会话；请确认拥有使用权。</p><button type="button" id="clear" class="text-button">清除上传字体</button></div></section>
<section class="control-section"><div class="field-label">强调色</div><div class="palette-switch" role="group" aria-label="强调色"><button type="button" data-palette="night" class="active" aria-pressed="true"><span class="swatch"><i style="background:#2e65b0"></i><i style="background:#ffb2d6"></i></span>蓝 / 粉</button><button type="button" data-palette="violet" aria-pressed="false"><span class="swatch"><i style="background:#b3a3e3"></i><i style="background:#f0d27a"></i></span>紫 / 黄</button><button type="button" data-palette="crimson" aria-pressed="false"><span class="swatch"><i style="background:#c7343c"></i><i style="background:#75737e"></i></span>红 / 灰</button><button type="button" data-palette="monochrome" aria-pressed="false"><span class="swatch"><i style="background:#a2a0ad"></i><i style="background:#ffffff"></i></span>灰 / 白</button></div></section>
<section class="control-section compact"><div class="inline-settings"><label for="count">候选<select id="count"><option>4</option><option selected>6</option><option>8</option></select></label><label for="seed">Seed<input id="seed" type="number" min="0" max="2147483647" value="42"></label></div><details><summary>画布与导出</summary><div class="inline-settings"><label for="width">宽<input id="width" type="number" value="1200" min="256" max="2400"></label><label for="height">高<input id="height" type="number" value="675" min="256" max="2400"></label></div><label class="check"><input id="transparent" type="checkbox">透明背景</label></details></section>
<div class="generate-row"><button class="generate" type="submit" id="generate" disabled>生成候选 <span aria-hidden="true">↗</span></button><button id="shuffle" type="button" class="icon-button" title="更换 Seed 并生成" aria-label="更换 Seed 并生成">⤨</button></div><div id="status" role="status" aria-live="polite">正在加载…</div><button id="cancel" class="text-button" type="button" hidden>取消生成</button>
</form></aside>
<section class="output" aria-label="排版结果">
<div class="output-top"><div class="output-title"><h1 id="preview-title">预览</h1><span id="provenance" class="badge" hidden></span><span id="stale" class="badge" hidden>设置已修改</span></div><div class="preview-actions"><button id="fullscreen" class="icon-button" aria-label="放大预览" title="放大预览" disabled>⤢</button><button id="download-svg" class="secondary-button" disabled>SVG</button><button id="download-png" class="primary-button" disabled>下载 PNG <span aria-hidden="true">↓</span></button></div></div>
<div class="preview" id="preview"><img id="preview-image" alt="选中的日文标题" hidden><div id="preview-loading" class="preview-loading"><span class="spinner"></span><span id="progress-text">加载字体与词典</span></div></div>
<div class="preview-meta"><span id="selected-label">—</span><span id="canvas-label">1200 × 675</span><button id="parameters" class="text-button" hidden>参数 JSON</button></div>
<div class="candidates-top"><h2>候选 <span id="result-count"></span></h2><div class="candidate-nav"><button id="previous" aria-label="上一个候选" class="icon-button" disabled>←</button><button id="next" aria-label="下一个候选" class="icon-button" disabled>→</button></div></div>
<div id="gallery" class="gallery" aria-label="候选列表"></div>
<div class="semantic-panel" id="semantic-panel" hidden><button type="button" id="semantic-toggle" class="semantic-toggle" aria-expanded="false">语义计划 <span aria-hidden="true">＋</span></button><div id="semantic-content" hidden></div><button type="button" id="semantic-replan" class="text-button">重新规划</button></div>
</section>
</main><dialog id="zoom-dialog"><button id="zoom-close" class="icon-button" aria-label="关闭放大预览">×</button><img alt="放大标题"></dialog>
<script type="module" src="/app.js"></script></body></html>
