<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="日文标题自动排版，提供传统算法与语义规划两种方案。"><title>日文标题排版</title><link rel="stylesheet" href="/style.css"><link rel="icon" href="/favicon.svg"><script>try{document.documentElement.dataset.theme=localStorage.getItem("title-ui-theme")||"day"}catch{document.documentElement.dataset.theme="day"}</script></head>
<body>
<header class="header"><a class="brand" href="/">日文标题排版</a><nav><a href="/benchmark/">A / B 对照</a><a href="/research.html">研究记录</a><div class="ui-theme-switch" role="group" aria-label="界面明暗"><button type="button" data-ui-theme="day">Day</button><button type="button" data-ui-theme="night">Night</button></div></nav></header>
<main class="workspace">
<aside class="controls"><form id="form">
<div class="mode-switch" role="tablist" aria-label="生成方案"><button type="button" class="active" data-mode="classic" role="tab" aria-selected="true">A · 传统算法</button><button type="button" data-mode="llm" role="tab" aria-selected="false">B · LLM 语义</button></div>
<div id="mode-note" class="notice" hidden></div>
<section class="control-section"><label class="field-label" for="text">标题 <span id="length"></span></label><select id="input-mode" class="input-mode" aria-label="输入转换方式"><option value="kanji">自动转为日文汉字</option><option value="translate">中文标题 → 日语</option><option value="original">保留原文</option></select><textarea id="text" rows="3" maxlength="80" spellcheck="false">聖域の終わりと、崩壊の始まり</textarea>
<div class="examples"><button type="button" data-text="待ちかねた再会">待ちかねた再会</button><button type="button" data-text="絶望という病">絶望という病</button><button type="button" data-text="命の価値">命の価値</button></div><div id="conversion-panel" class="conversion-panel" hidden><div class="field-label"><label for="render-text">排版文本</label><button type="button" id="conversion-reset" class="text-button">重新转换</button></div><textarea id="render-text" rows="2" maxlength="80" spellcheck="false"></textarea><p id="conversion-note"></p></div></section>
<section class="control-section"><div class="field-label">字体 <button type="button" class="text-button" id="upload-toggle" aria-expanded="false">上传字体</button></div>
<label class="select-field" for="kanji-select"><span>汉字</span><select id="kanji-select" aria-label="汉字字体"></select></label>
<label class="select-field" for="kana-select"><span>假名</span><select id="kana-select" aria-label="假名字体"></select></label>
<div id="uploads" class="uploads" hidden><label class="upload" for="kanji"><span>上传主体字体</span><span id="kanji-name">TTF / OTF · 24 MiB</span></label><input id="kanji" type="file" accept=".ttf,.otf" class="file-input"><label class="upload" for="kana"><span>上传假名字体</span><span id="kana-name">TTF / OTF · 24 MiB</span></label><input id="kana" type="file" accept=".ttf,.otf" class="file-input"><p id="privacy-note">上传字体仅限当前会话；请确认拥有使用权。</p><button type="button" id="clear" class="text-button">清除上传字体</button></div></section>
<section class="control-section"><div class="field-label">强调色</div><div class="palette-switch" role="group" aria-label="强调色"><button type="button" data-palette="night" class="active" aria-pressed="true"><span class="swatch"><i style="background:#2e65b0"></i><i style="background:#ffb2d6"></i></span>蓝 / 粉</button><button type="button" data-palette="violet" aria-pressed="false"><span class="swatch"><i style="background:#b3a3e3"></i><i style="background:#f0d27a"></i></span>紫 / 黄</button><button type="button" data-palette="crimson" aria-pressed="false"><span class="swatch"><i style="background:#c7343c"></i><i style="background:#75737e"></i></span>红 / 灰</button><button type="button" data-palette="monochrome" aria-pressed="false"><span class="swatch"><i style="background:#a2a0ad"></i><i style="background:#ffffff"></i></span>灰 / 白</button></div><details id="custom-palette-panel"><summary>自定义配色</summary><label class="check"><input id="custom-palette-enabled" type="checkbox">启用自定义配色</label><div id="custom-palette-fields"><div class="custom-color-row"><label for="foreground-color">前景色</label><input id="foreground-color" type="color" value="#ffffff" aria-label="自定义前景色"><input id="foreground-hex" class="hex-color" value="#ffffff" maxlength="7" aria-label="前景色 HEX"></div><div id="accent-color-list"></div><button id="add-accent-color" class="text-button" type="button">＋ 添加强调色</button></div></details></section>
<section class="control-section compact"><div class="inline-settings"><label for="count">候选<select id="count"><option>4</option><option selected>6</option><option>8</option></select></label><label for="color-mode">着色<select id="color-mode"><option value="auto">自动强调</option><option value="single">单色强调</option><option value="dual">双色强调</option><option value="none">统一前景色</option></select></label></div><details><summary>画布与复现</summary><div class="inline-settings"><label for="canvas-theme">画布<select id="canvas-theme"><option value="night">Night · 黑底</option><option value="day">Day · 白底</option></select></label><label for="seed" title="相同文字、字体、设置与 Seed 可复现同一组布局；不控制模型翻译。">Seed<input id="seed" type="number" min="0" max="2147483647" value="42"></label></div><div class="inline-settings"><label for="width">宽<input id="width" type="number" value="1200" min="256" max="2400"></label><label for="height">高<input id="height" type="number" value="675" min="256" max="2400"></label></div></details></section>
<div class="generate-row"><button class="generate" type="submit" id="generate" disabled>生成候选 <span aria-hidden="true">↗</span></button><button id="shuffle" type="button" class="secondary-button" title="改变字号关系、错位和留白，生成新的一组" aria-label="换一组布局">换一组</button></div><div id="status" role="status" aria-live="polite">正在加载…</div><button id="cancel" class="text-button" type="button" hidden>取消生成</button>
</form></aside>
<section class="output" aria-label="排版结果">
<div class="output-top"><div class="output-title"><h1 id="preview-title">预览</h1><span id="provenance" class="badge" hidden></span><span id="stale" class="badge" hidden>设置已修改</span></div><div class="preview-actions"><label class="export-transparent"><input id="transparent" type="checkbox">透明背景</label><button id="fullscreen" class="icon-button" aria-label="放大预览" title="放大预览" disabled>⤢</button><button id="download-svg" class="secondary-button" disabled>SVG</button><button id="download-png" class="primary-button" disabled>下载 PNG <span aria-hidden="true">↓</span></button></div></div>
<div class="preview" id="preview"><img id="preview-image" alt="选中的日文标题" hidden><div id="preview-loading" class="preview-loading"><span class="spinner"></span><span id="progress-text">加载字体与词典</span></div></div>
<div class="preview-meta"><span id="selected-label">—</span><span id="canvas-label">1200 × 675</span><button id="parameters" class="text-button" hidden>参数 JSON</button></div>
<section id="color-editor" class="color-editor" hidden><div class="field-label"><span>局部颜色</span><button id="reset-all-colors" class="text-button" type="button">恢复全部自动色</button></div><div id="character-colors" class="character-colors" role="group" aria-label="选择要着色的文字"></div><div class="color-editor-actions"><span id="color-selection">选择文字</span><input id="glyph-color" type="color" value="#ffb2d6" aria-label="局部文字颜色" disabled><input id="glyph-hex" class="hex-color" value="#ffb2d6" maxlength="7" aria-label="局部颜色 HEX" disabled><button id="apply-glyph-color" type="button" class="secondary-button" disabled>应用颜色</button><button id="reset-glyph-color" type="button" class="text-button" disabled>恢复自动</button></div><div id="color-quick-picks" class="color-quick-picks" role="group" aria-label="快速选色"></div><div id="color-warning" class="color-warning" role="status" hidden></div></section><div class="candidates-top"><h2>候选 <span id="result-count"></span></h2><div class="candidate-nav"><button id="previous" aria-label="上一个候选" class="icon-button" disabled>←</button><button id="next" aria-label="下一个候选" class="icon-button" disabled>→</button></div></div>
<div id="gallery" class="gallery" aria-label="候选列表"></div>
<details id="color-audit" class="color-audit" hidden><summary>着色依据</summary><div id="color-audit-content"></div></details>
<div class="semantic-panel" id="semantic-panel" hidden><button type="button" id="semantic-toggle" class="semantic-toggle" aria-expanded="false">语义计划 <span aria-hidden="true">＋</span></button><div id="semantic-content" hidden></div><button type="button" id="semantic-replan" class="text-button">重新规划</button></div>
</section>
</main><dialog id="zoom-dialog"><button id="zoom-close" class="icon-button" aria-label="关闭放大预览">×</button><img alt="放大标题"></dialog>
<script type="module" src="/app.js"></script></body></html>
